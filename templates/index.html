<!doctype html><html><head><meta charset="utf-8"><title>PDF Tool</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;background:#f3f5f9;display:flex;justify-content:center;padding:40px}
.card{background:#fff;padding:32px;border-radius:14px;box-shadow:0 4px 20px #0001;max-width:560px;width:100%}
h1{margin-top:0}#drop{border:2px dashed #8aa;border-radius:10px;padding:40px;text-align:center;cursor:pointer}
#drop.over{background:#eef6ff}button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}small{color:#666}#list{margin:10px 0;font-size:14px}#msg{margin-top:12px}
</style></head><body><div class="card">
<h1>📄 Convert anything to PDF</h1>
<small>Supported: {{exts}}</small>
<form id="f"><div id="drop">Drop files here or click to choose<input id="in" type="file" name="files" multiple hidden></div>
<div id="list"></div><button id="btn" disabled>Convert to PDF</button></form><div id="msg"></div>
</div><script>
const drop=document.getElementById('drop'),inp=document.getElementById('in'),btn=document.getElementById('btn'),list=document.getElementById('list'),msg=document.getElementById('msg');
let files=[];
const show=()=>{list.innerHTML=files.map(f=>'• '+f.name).join('<br>');btn.disabled=!files.length};
drop.onclick=()=>inp.click();inp.onchange=()=>{files=[...inp.files];show()};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');files=[...e.dataTransfer.files];show()};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Converting…';
 const fd=new FormData();files.forEach(f=>fd.append('files',f));
 const r=await fetch('convert',{method:'POST',body:fd});
 if(!r.ok){msg.textContent='Error: '+(await r.json()).error;btn.disabled=false;return}
 const b=await r.blob(),cd=r.headers.get('Content-Disposition')||'',m=cd.match(/filename=\"?([^\";]+)/);
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=m?m[1]:'converted.pdf';a.click();
 msg.textContent='✅ Done!';btn.disabled=false};
</script></body></html>
